name: Bug report
description: Report a reproducible defect
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken, and what should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce the defect.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know the fix is complete?
    validations:
      required: true
  - type: textarea
    id: reversion
    attributes:
      label: Reversion actions
      description: How to roll back or mitigate if the fix causes harm?
    validations:
      required: true
